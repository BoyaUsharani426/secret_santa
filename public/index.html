<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa 🎅</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#c0272d; --green:#14532d; --gold:#f5c542; --card:rgba(255,255,255,.12); }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; font-family:'Poppins',sans-serif; color:#fff;
    background: radial-gradient(circle at 20% 10%, #1f7a43 0%, #0e3b21 45%, #5a0f14 100%);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow-x:hidden;
  }
  h1,h2 { font-family:'Mountains of Christmas',cursive; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.4); }
  h1 { font-size:2.8rem; text-align:center; }
  h2 { font-size:1.8rem; margin-bottom:10px; }
  .wrap { width:100%; max-width:460px; position:relative; z-index:2; }
  .card { background:var(--card); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.25);
          border-radius:22px; padding:26px; margin-top:18px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { flex:1; padding:10px; border-radius:12px; border:0; cursor:pointer; font-weight:600;
         background:rgba(255,255,255,.15); color:#fff; }
  .tab.active { background:var(--red); }
  input { width:100%; padding:13px 14px; border-radius:12px; border:2px solid transparent; outline:none;
          font-size:1rem; margin-bottom:12px; font-family:inherit; }
  input:focus { border-color:var(--gold); }
  #code { text-transform:uppercase; letter-spacing:4px; text-align:center; font-weight:600; }
  .btn { width:100%; padding:14px; border:0; border-radius:14px; font-size:1.05rem; font-weight:600; cursor:pointer;
         background:linear-gradient(135deg,#e53935,#b71c1c); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.35); transition:.2s; }
  .btn:hover { transform:translateY(-2px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .hidden { display:none !important; }
  .roomcode { font-size:2.4rem; letter-spacing:8px; text-align:center; font-weight:600; color:var(--gold);
              background:rgba(0,0,0,.25); border-radius:14px; padding:10px; cursor:pointer; }
  .hint { text-align:center; font-size:.8rem; opacity:.8; margin:6px 0 14px; }
  .group-title { margin:14px 0 6px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:rgba(255,255,255,.18); padding:6px 12px; border-radius:20px; font-size:.9rem; }
  .err { background:#ffebee; color:#b71c1c; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:.9rem; }
  .stage { text-align:center; padding:10px 0; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gift { font-size:6rem; animation:shake 0.6s infinite; }
  .gift.open { animation:pop .6s forwards; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg) scale(1.05)} 75%{transform:rotate(12deg) scale(1.05)} }
  @keyframes pop { to { transform:scale(0); opacity:0; } }
  .slot { font-family:'Mountains of Christmas',cursive; font-size:2.6rem; color:var(--gold); min-height:3.4rem;
          background:rgba(0,0,0,.3); border-radius:16px; padding:8px 22px; margin-top:8px; border:2px dashed var(--gold); }
  .slot.final { animation:glow 1s infinite alternate; color:#fff; border-style:solid; }
  @keyframes glow { from{box-shadow:0 0 10px var(--gold)} to{box-shadow:0 0 34px var(--gold)} }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:.92rem; }
  td,th { padding:8px 6px; text-align:left; border-bottom:1px solid rgba(255,255,255,.15); }
  .snow, .confetti { position:fixed; top:-30px; pointer-events:none; z-index:1; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }
  .small { background:none; border:0; color:#fff; opacity:.7; text-decoration:underline; cursor:pointer; margin-top:14px; width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎅 Secret Santa 🎄</h1>

  <!-- HOME -->
  <div id="home" class="card">
    <div class="tabs">
      <button class="tab active" data-tab="join">Join Room</button>
      <button class="tab" data-tab="create">Create Room</button>
    </div>
    <div id="homeErr" class="err hidden"></div>
    <input id="code" placeholder="ROOM CODE" maxlength="6">
    <input id="email" type="email" placeholder="Your work email">
    <button class="btn" id="homeBtn">Join the fun 🎁</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <h2>Waiting Room</h2>
    <div class="roomcode" id="roomCode" title="Click to copy"></div>
    <div class="hint">Share this code with your team (tap to copy)</div>
    <div id="lobbyErr" class="err hidden"></div>
    <div class="group-title">🏡 Remote (<span id="rc">0</span>)</div>
    <div class="chips" id="remoteChips"></div>
    <div class="group-title">🏢 Office (<span id="oc">0</span>)</div>
    <div class="chips" id="officeChips"></div>
    <button class="btn hidden" id="startBtn" style="margin-top:20px">🎲 Start Game</button>
    <div class="hint hidden" id="waitMsg" style="margin-top:18px">Waiting for admin to start the game…</div>
  </div>

  <!-- GAME -->
  <div id="game" class="card hidden">
    <h2 id="hello"></h2>
    <div class="stage" id="stage"></div>
    <div id="adminBox" class="hidden">
      <div class="group-title">👑 Admin: Gift Opening Status</div>
      <table><thead><tr><th>Name</th><th>Group</th><th>Status</th></tr></thead><tbody id="progress"></tbody></table>
    </div>
  </div>

  <button class="small hidden" id="leave">Leave room</button>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session = JSON.parse(localStorage.getItem('ss') || 'null');
let mode = 'join', revealing = false, shown = false;
/* ---------- decoration ---------- */
for (let i = 0; i < 45; i++) {
  const s = document.createElement('div');
  s.className = 'snow'; s.textContent = '❄';
  s.style.left = Math.random()*100 + 'vw';
  s.style.fontSize = (10 + Math.random()*18) + 'px';
  s.style.opacity = .4 + Math.random()*.5;
  s.style.animationDuration = (6 + Math.random()*10) + 's';
  s.style.animationDelay = (-Math.random()*12) + 's';
  s.style.animationIterationCount = 'infinite';
  document.body.appendChild(s);
}
function confetti() {
  const items = ['🎉','🎄','⭐','🎁','❄️','✨'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti'; c.textContent = items[i % items.length];
    c.style.left = Math.random()*100 + 'vw';
    c.style.fontSize = (16 + Math.random()*20) + 'px';
    c.style.animationDuration = (2 + Math.random()*3) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

/* ---------- api ---------- */
async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
function show(id) {
  ['home','lobby','game'].forEach(v => $('#'+v).classList.toggle('hidden', v !== id));
  $('#leave').classList.toggle('hidden', id === 'home');
}
function err(id, msg) { const e = $(id); e.textContent = msg; e.classList.toggle('hidden', !msg); }

/* ---------- home ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  mode = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('#code').classList.toggle('hidden', mode === 'create');
  $('#homeBtn').textContent = mode === 'create' ? 'Create Room 🎄' : 'Join the fun 🎁';
  err('#homeErr', '');
});
$('#homeBtn').onclick = async () => {
  err('#homeErr', '');
  const email = $('#email').value.trim();
  try {
    const d = mode === 'create'
      ? await api('/rooms', 'POST', { email })
      : await api(`/rooms/${$('#code').value.trim().toUpperCase()}/join`, 'POST', { email });
    session = { code: d.code, token: d.token };
    localStorage.setItem('ss', JSON.stringify(session));
    poll();
  } catch (e) { err('#homeErr', e.message); }
};
$('#leave').onclick = leave;
function leave() { localStorage.removeItem('ss'); location.reload(); }
$('#roomCode').onclick = () => { navigator.clipboard?.writeText(session.code); $('#roomCode').style.opacity = .6; setTimeout(()=>$('#roomCode').style.opacity=1, 300); };

/* ---------- lobby ---------- */
$('#startBtn').onclick = async () => {
  err('#lobbyErr', '');
  try { await api(`/rooms/${session.code}/start`, 'POST', { token: session.token }); poll(); }
  catch (e) { err('#lobbyErr', e.message); }
};
function renderLobby(s) {
  show('lobby');
  $('#roomCode').textContent = s.code;
  const chips = g => s.participants.filter(p => p.group === g).map(p => `<span class="chip">${esc(p.name)}</span>`).join('');
  $('#remoteChips').innerHTML = chips('remote'); $('#officeChips').innerHTML = chips('office');
  $('#rc').textContent = s.participants.filter(p => p.group === 'remote').length;
  $('#oc').textContent = s.participants.filter(p => p.group === 'office').length;
  $('#startBtn').classList.toggle('hidden', !s.me.isAdmin);
  $('#startBtn').disabled = s.participants.length < 2;
  $('#waitMsg').classList.toggle('hidden', s.me.isAdmin);
}

/* ---------- game / reveal ---------- */
function renderGame(s) {
  show('game');
  $('#hello').textContent = `Hi ${s.me.name}! 🎅`;
  $('#adminBox').classList.toggle('hidden', !s.me.isAdmin);
  if (s.progress) {
    $('#progress').innerHTML = s.progress.map(p =>
      `<tr><td>${esc(p.name)}</td><td>${p.group === 'remote' ? '🏡' : '🏢'}</td><td>${p.revealed ? '✅ Opened' : '⏳ Waiting'}</td></tr>`).join('');
  }
  if (!s.me.revealed && !revealing && !shown) runReveal();
  else if (!revealing && !shown)
    $('#stage').innerHTML = `<div class="gift" style="animation:none">🎁</div><p>You've already opened your gift.<br>Keep it a secret! 🤫</p>`;
}

async function runReveal() {
  revealing = true;
  $('#stage').innerHTML = `<div class="gift" id="gift">🎁</div><p>Your Secret Santa match is ready…</p>`;
  let data;
  try { data = await api(`/rooms/${session.code}/reveal`, 'POST', { token: session.token }); }
  catch (e) { revealing = false; return; }
  await new Promise(r => setTimeout(r, 2200));
  if (data.already) { revealing = false; return; }
  $('#gift').classList.add('open');
  await new Promise(r => setTimeout(r, 500));
  $('#stage').innerHTML = `<p>🎄 You are Secret Santa for…</p><div class="slot" id="slot">?</div>`;
  await spin(data.name, data.decoys);
  $('#slot').classList.add('final');
  confetti();
  $('#stage').insertAdjacentHTML('beforeend',
    `<p style="margin-top:16px">🤫 Shhh! Don't tell anyone.<br><small>This name is shown only once.</small></p>`);
  shown = true; revealing = false;
}
function spin(finalName, decoys) {
  return new Promise(resolve => {
    const el = $('#slot'), pool = decoys.length ? decoys : [finalName];
    let i = 0, delay = 60;
    (function tick() {
      if (delay > 420) { el.textContent = finalName; return resolve(); }
      el.textContent = pool[i++ % pool.length];
      delay *= 1.12; setTimeout(tick, delay);
    })();
  });
}

/* ---------- polling ---------- */
async function poll() {
  if (!session) return;
  try {
    const s = await api(`/rooms/${session.code}/state?token=${session.token}`);
    s.status === 'lobby' ? renderLobby(s) : renderGame(s);
  } catch (e) {
    if (/not found|Invalid session/i.test(e.message)) leave();
  }
}
if (session) poll(); else show('home');
setInterval(poll, 2000);
$('#code').classList.remove('hidden');
</script>
</body>
</html>
